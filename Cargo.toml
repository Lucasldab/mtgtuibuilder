[package]
name = "mtgtuibuilder"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
dirs = "5"
anyhow = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
