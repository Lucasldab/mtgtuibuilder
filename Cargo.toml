[package]
name = "mtgtuibuilder"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
dirs = "5"
anyhow = "1"
# Cards are JPEG; skipping the other decoders keeps build time down.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "9", default-features = false }
base64 = "0.22"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
