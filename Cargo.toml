[package]
name = "mtgtuibuilder"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal Magic: the Gathering deck builder with Cardmarket prices"
repository = "https://github.com/Lucasldab/mtgtuibuilder"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
dirs = "5"
anyhow = "1"
# Cards are JPEG; skipping the other decoders keeps build time down.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# 11.1 carries the per-cell kitty placeholder fix (ratatui/ratatui-image#201),
# so card images render under tmux.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
